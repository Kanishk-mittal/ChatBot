version: '3.8'
services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS="--requirepass 1234" # Optional: set a password
    volumes:
      - redis-stack-data:/data

volumes:
  redis-stack-data: